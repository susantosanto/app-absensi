<!DOCTYPE html>
<html lang="id">

<head>

        /* Top Bar: Logo & Title - MODERN DESIGN */

        .app-title small {

            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");

        /* MAIN CONTENT OVERLAY */

            padding: 0 20px;

        }

        /* CARD STYLE */
        .card {
            background: white;

            padding: 24px;

        }

        .btn-checkin {

        .section-header {

            justify-content: space-between;

        .section-title {

            font-weight: 600;

            align-items: center;

        }

        .btn-refresh-gps:active {
            transform: scale(0.95);
        }

            animation: spin 0.6s ease-in-out;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);

        #map {
            height: 180px;
            border-radius: 12px;

        }

        /* IZIN BUTTON (Full Width) */
        .btn-izin {

            margin-top: 10px;

            border: 1px solid #e2e8f0;

        /* Loading Overlay */
        #pageLoader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* FOOTER COPYRIGHT - MODERN & ELEGANT */
        .app-footer {
            position: fixed;
            bottom: 80px;
            /* Above bottom nav */

            right: 0;

            backdrop-filter: blur(10px);

    <!-- Hidden NPSN Inject -->
    <script>
        // TERIMA NPSN DARI SERVER
        let npsn = "<?= npsn ?>";
        if (npsn.includes('?')) npsn = null;

        // ============ JS UTAMA ============
        let appData = null;
        let mapInstance = null;
        let currentPosition = null;
        let userMarker = null;

        window.onload = function () {
            // Hilangkan Loader
            setTimeout(() => { document.getElementById('pageLoader').style.display = 'none'; }, 800);

            updateClock();
            setInterval(updateClock, 1000);

            initMapDefault();

            if (!npsn || npsn === 'undefined') {
                const urlParams = new URLSearchParams(window.location.search);
                const npsnUrl = urlParams.get('npsn');
                if (npsnUrl) npsn = npsnUrl;
            }

            if (npsn && npsn.length > 4) {
                loadSchoolData();
            } else {
                Swal.fire('Error', 'Link Absensi Tidak Valid (NPSN Missing)', 'error');
            }
        };

        function updateClock() {
            const now = new Date();
            // Jam HH:MM
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;

            // Tanggal Indonesia
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateDisplay').innerText = now.toLocaleDateString('id-ID', options);
        }

        // --- SISA FUNGSI JS SAMA SEPERTI SEBELUMNYA (Map, Data, Action) ---

        function loadSchoolData() {
            google.script.run
                .withSuccessHandler(response => {
                    if (response.success) {
                        appData = response.data;
                        updateAppWithData();
                        document.getElementById('btnIzin').disabled = false;
                    } else {
                        Swal.fire('Error Database', response.message, 'error');
                    }
                })
                .withFailureHandler(err => {
                    Swal.fire('Koneksi Gagal', 'Gagal memuat data sekolah.', 'error');
                })
                .getSchoolData(npsn);
        }

        function updateAppWithData() {
            document.getElementById('schoolName').innerText = appData.config.schoolName;
            const select = document.getElementById('selectGuru');
            select.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
            appData.teachers.forEach(teacher => {
                const option = document.createElement('option');
                option.value = teacher.nama;
                option.textContent = teacher.nama;
                select.appendChild(option);
            });
            updateMapToSchool();
        }

        function initMapDefault() {
            mapInstance = L.map('map', { zoomControl: false }).setView([-6.2, 106.8], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);

            if (navigator.geolocation) {
                // Get initial position first (faster lock)
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        currentPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
                        console.log('📍 Initial GPS Position:', currentPosition);
                        updateUserMarker();
                        validateGPSLocation();
                    },
                    err => {
                        console.warn('Initial GPS failed, waiting for watchPosition...', err);
                    },
                    { enableHighAccuracy: true, timeout: 30000, maximumAge: 60000 }
                );

                // Then watch for position changes
                navigator.geolocation.watchPosition(pos => {
                    currentPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
                    console.log('📍 GPS Position Updated:', currentPosition);
                    updateUserMarker();
                    validateGPSLocation();
                }, err => {
                    // Detailed GPS Error Handling
                    console.error('❌ GPS Error:', err);
                    const statusEl = document.getElementById('gpsStatus');

                    let errorMsg = 'GPS Error';
                    let detailMsg = '';

                    switch (err.code) {
                        case err.PERMISSION_DENIED:
                            errorMsg = '🚫 Akses Ditolak';
                            detailMsg = 'Izinkan akses lokasi di browser Anda untuk menggunakan fitur absensi.';
                            Swal.fire({
                                icon: 'warning',
                                title: 'Akses Lokasi Dibutuhkan',
                                text: 'Silakan izinkan akses lokasi di pengaturan browser, lalu refresh halaman ini.',
                                confirmButtonText: 'Mengerti'
                            });
                            break;
                        case err.POSITION_UNAVAILABLE:
                            errorMsg = '📡 Lokasi Tidak Tersedia';
                            detailMsg = 'Sistem tidak dapat menentukan lokasi Anda. Pastikan GPS aktif.';
                            break;
                        case err.TIMEOUT:
                            errorMsg = '⏱️ Mencari GPS...';
                            detailMsg = 'Menunggu sinyal GPS. Pastikan Anda di area terbuka.';
                            console.log('GPS timeout, akan retry otomatis...');
                            // Don't show alert for timeout, watchPosition will keep trying
                            break;
                        default:
                            errorMsg = '❓ GPS Error';
                            detailMsg = err.message || 'Error tidak diketahui';
                    }

                    statusEl.innerText = errorMsg;
                    statusEl.style.color = '#b91c1c';
                    statusEl.style.background = '#fef2f2';
                    console.warn('GPS Error Details:', detailMsg);
                }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 10000 });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Browser Tidak Mendukung GPS',
                    text: 'Browser Anda tidak mendukung Geolocation API. Gunakan browser modern seperti Chrome atau Firefox.',
                    confirmButtonText: 'OK'
                });
            }
        }

        function updateMapToSchool() {
            if (!mapInstance || !appData) return;
            const { lat, lng, radius } = appData.config;
            mapInstance.setView([lat, lng], 16);
            L.marker([lat, lng]).addTo(mapInstance).bindPopup('Sekolah');
            L.circle([lat, lng], { radius: radius, color: '#10b981', fillOpacity: 0.2 }).addTo(mapInstance);
        }

        function updateUserMarker() {
            if (!currentPosition || !mapInstance) return;
            if (userMarker) mapInstance.removeLayer(userMarker);
            userMarker = L.marker([currentPosition.lat, currentPosition.lng], {
                icon: L.icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
                    iconSize: [25, 41], iconAnchor: [12, 41]
                })
            }).addTo(mapInstance);
        }

        function validateGPSLocation() {
            const statusEl = document.getElementById('gpsStatus');
            if (!currentPosition || !appData) return;

            const dist = getDistance(currentPosition.lat, currentPosition.lng, appData.config.lat, appData.config.lng);
            const inRadius = dist <= appData.config.radius;

            if (inRadius) {
                statusEl.innerHTML = '✅ Di Zona Sekolah';
                statusEl.style.color = '#10b981';
                statusEl.style.background = '#ecfdf5';
            } else {

        function refreshGPS() {
            console.log('🔄 Manual GPS Refresh triggered');
            const btn = document.querySelector('.btn-refresh-gps i');
            btn.style.animation = 'spin 0.6s ease-in-out';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        currentPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
                        console.log('✅ GPS Refreshed:', currentPosition);
                        updateUserMarker();
                        validateGPSLocation();

                        // Success feedback
                        Swal.fire({
                            icon: 'success',
                            title: 'GPS Diperbarui',
                            text: `Akurasi: ${Math.round(pos.coords.accuracy)}m`,
                            timer: 2000,
                            showConfirmButton: false,
                            toast: true,
                            position: 'top-end'
                        });
                    },
                    err => {
                        console.error('❌ GPS Refresh Failed:', err);
                        Swal.fire({
                            icon: 'error',
                            title: 'Gagal',
                            text: 'Tidak dapat mendapatkan lokasi GPS',
                            timer: 2000,
                            showConfirmButton: false,
                            toast: true,
                            position: 'top-end'
                        });
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // ============ ACTION FLOWS ============
        function compressImage(file) {
            return new Promise((resolve) => {
                console.log('📸 Compressing image:', file.name, 'Size:', file.size, 'bytes');
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = e => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        const max = 800; let w = img.width, h = img.height;
                        console.log('Original dimensions:', w, 'x', h);
                        if (w > h) { if (w > max) { h *= max / w; w = max; } } else { if (h > max) { w *= max / h; h = max; } }
                        canvas.width = w; canvas.height = h; ctx.drawImage(img, 0, 0, w, h);
                        const compressed = canvas.toDataURL('image/jpeg', 0.7);
                        console.log('✅ Compressed dimensions:', w, 'x', h, 'Data length:', compressed.length);
                        resolve(compressed);
                    };
                };
            });
        }

                didOpen: () => document.getElementById('cam').click(),
                preConfirm: () => document.getElementById('cam').files[0] || Swal.showValidationMessage('Foto wajib!')
            });
            if (!photoFile) return;

            const compressedPhoto = await compressImage(photoFile);

            const { value: pin } = await Swal.fire({
                title: '🔐 PIN',
                input: 'password',
                inputAttributes: { maxlength: 6, pattern: '[0-9]*', inputmode: 'numeric' },
                inputValidator: v => v.length != 6 ? 'PIN 6 digit!' : null,
                showCancelButton: true,
                cancelButtonText: 'Batal',
                confirmButtonText: 'Verifikasi'
            });
            if (!pin) return;

            // Late Logic
            let alasan = '';
            const now = new Date();
            const [h, m] = appData.config.jamMasuk.split(':');
            const d = new Date(); d.setHours(h, m, 0);
            if (now > d) {
                const { value: reason } = await Swal.fire({ title: '⏰ Terlambat', input: 'textarea', inputLabel: 'Alasan', inputValidator: v => !v ? 'Wajib diisi!' : null });
                if (!reason) return; alasan = reason;
            }

            console.log('📤 Sending Check In data to server...');
            Swal.fire({ title: 'Proses...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            google.script.run
                .withSuccessHandler(res => {
                    console.log('✅ Server Response:', res);
                    Swal.fire(res.success ? 'Sukses' : 'Gagal', res.message, res.success ? 'success' : 'error');
                })
                .withFailureHandler(err => {
                    console.error('❌ Server Error:', err);
                    Swal.fire('Error', 'Gagal menghubungi server: ' + err.message, 'error');
                })
                .processAttendance({ tipe: 'Check In', nama, pin, lat: currentPosition.lat, lng: currentPosition.lng, foto: compressedPhoto, alasan, npsn });
        }
